name: Release Docker Images

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_API: ghcr.io/aremox/mypodcast-api
  IMAGE_NAME_WEB: ghcr.io/aremox/mypodcast-web

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          load: true
          tags: ${{ env.IMAGE_NAME_API }}:${{ github.ref_name }}

      - name: Run Trivy vulnerability scanner on API
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.IMAGE_NAME_API }}:${{ github.ref_name }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Build Web image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          load: true
          tags: ${{ env.IMAGE_NAME_WEB }}:${{ github.ref_name }}

      - name: Run Trivy vulnerability scanner on Web
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.IMAGE_NAME_WEB }}:${{ github.ref_name }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Push API image
        run: |
          docker tag ${{ env.IMAGE_NAME_API }}:${{ github.ref_name }} ${{ env.IMAGE_NAME_API }}:latest
          docker push ${{ env.IMAGE_NAME_API }}:${{ github.ref_name }}
          docker push ${{ env.IMAGE_NAME_API }}:latest

      - name: Push Web image
        run: |
          docker tag ${{ env.IMAGE_NAME_WEB }}:${{ github.ref_name }} ${{ env.IMAGE_NAME_WEB }}:latest
          docker push ${{ env.IMAGE_NAME_WEB }}:${{ github.ref_name }}
          docker push ${{ env.IMAGE_NAME_WEB }}:latest
