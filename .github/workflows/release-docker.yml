name: Release Docker Images

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_API: ghcr.io/aremox/mypodcast-api
  IMAGE_NAME_WEB: ghcr.io/aremox/mypodcast-web

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Inject Version into Web App
        run: |
          node -e "
          const fs = require('fs');
          const file = 'apps/web/src/app/shared/components/navbar/navbar.component.ts';
          let content = fs.readFileSync(file, 'utf8');
          content = content.replace(/v\d+\.\d+\.\d+(-[a-zA-Z0-9.-]+)?/, '${{ github.ref_name }}');
          fs.writeFileSync(file, content, 'utf8');
          "

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          load: true
          tags: ${{ env.IMAGE_NAME_API }}:${{ github.ref_name }}

      - name: Run Trivy vulnerability scanner on API
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: '${{ env.IMAGE_NAME_API }}:${{ github.ref_name }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Build Web image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          load: true
          tags: ${{ env.IMAGE_NAME_WEB }}:${{ github.ref_name }}

      - name: Run Trivy vulnerability scanner on Web
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: '${{ env.IMAGE_NAME_WEB }}:${{ github.ref_name }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Push API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ env.IMAGE_NAME_API }}:${{ github.ref_name }},${{ env.IMAGE_NAME_API }}:latest

      - name: Push Web image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ env.IMAGE_NAME_WEB }}:${{ github.ref_name }},${{ env.IMAGE_NAME_WEB }}:latest
