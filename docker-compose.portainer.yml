services:
  # === MongoDB ===
  mongodb:
    image: mongo:7
    container_name: mypodcast-mongodb
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=mypodcast
      - TZ=Europe/Madrid
    networks:
      - mypodcast-net

  # === NestJS API ===
  api:
    image: ghcr.io/aremox/mypodcast-api:v1.13.27-stable
    container_name: mypodcast-api
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - MONGODB_URI=mongodb://mongodb:27017/mypodcast
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - FRONTEND_URL=http://192.168.1.107:84
      - TZ=Europe/Madrid
    depends_on:
      - mongodb
    networks:
      - mypodcast-net

  # === Angular PWA (nginx) ===
  web:
    image: ghcr.io/aremox/mypodcast-web:v1.13.27-stable
    container_name: mypodcast-web
    restart: unless-stopped
    environment:
      - TZ=Europe/Madrid
    ports:
      - "84:80"
    depends_on:
      - api
    networks:
      - mypodcast-net

volumes:
  mongodb_data:
    driver: local

networks:
  mypodcast-net:
    driver: bridge
