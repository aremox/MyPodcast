services:
  # === MongoDB ===
  mongodb:
    image: mongo:7
    container_name: mypodcast-mongodb
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: mypodcast
    networks:
      - mypodcast-net

  # === NestJS API ===
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: mypodcast-api
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - MONGODB_URI=mongodb://mongodb:27017/mypodcast
      - JWT_SECRET=mypodcast-super-secret-key-2026
      - JWT_REFRESH_SECRET=mypodcast-refresh-secret-2026
      - FRONTEND_URL=http://192.168.1.107:84
    depends_on:
      - mongodb
    networks:
      - mypodcast-net

  # === Angular PWA (nginx) ===
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: mypodcast-web
    restart: unless-stopped
    ports:
      - "84:80"
    depends_on:
      - api
    networks:
      - mypodcast-net

volumes:
  mongodb_data:
    driver: local

networks:
  mypodcast-net:
    driver: bridge
